name: Build Environment (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to install'
        required: false
        type: string
        default: "3.13"
      ta-lib-version:
        description: 'TA-Lib version to install'
        required: false
        type: string
        default: "0.4.0"
    outputs:
      environment-ready:
        description: "Whether the environment was successfully built"
        value: ${{ jobs.build-environment.outputs.environment-ready }}
      cache-key:
        description: "Cache key for the built environment"
        value: ${{ jobs.build-environment.outputs.cache-key }}

permissions:
  contents: read

jobs:
  build-environment:
    name: Build Environment
    runs-on: ubuntu-24.04

    outputs:
      environment-ready: ${{ steps.env-status.outputs.ready }}
      cache-key: ${{ steps.cache-keys.outputs.env-key }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Generate Cache Keys
      id: cache-keys
      run: |
        # Create a composite cache key for the entire environment
        ENV_KEY="${{ runner.os }}-env-py${{ inputs.python-version }}-talib${{ inputs.ta-lib-version }}-$(date +%Y%m%d)"
        echo "env-key=$ENV_KEY" >> $GITHUB_OUTPUT
        echo "Environment cache key: $ENV_KEY"

    # === Linux Dependencies ===
    - name: Check Linux Dependencies
      id: check-deps
      run: |
        echo "Checking if build dependencies are available..."
        MISSING_DEPS=""

        # Check each required package
        if ! dpkg -l | grep -q "^ii.*build-essential"; then
          MISSING_DEPS="$MISSING_DEPS build-essential"
        fi
        if ! dpkg -l | grep -q "^ii.*autoconf"; then
          MISSING_DEPS="$MISSING_DEPS autoconf"
        fi
        if ! dpkg -l | grep -q "^ii.*libtool"; then
          MISSING_DEPS="$MISSING_DEPS libtool"
        fi

        if [ -z "$MISSING_DEPS" ]; then
          echo "All dependencies already available"
          echo "deps-needed=false" >> $GITHUB_OUTPUT
        else
          echo "Missing dependencies:$MISSING_DEPS"
          echo "deps-needed=true" >> $GITHUB_OUTPUT
        fi

    - name: Install Linux Dependencies
      if: steps.check-deps.outputs.deps-needed == 'true'
      run: |
        echo "Installing missing Linux dependencies..."
        sudo apt-get update
        sudo apt-get install -y build-essential autoconf libtool

    - name: Verify Linux Dependencies
      run: |
        echo "Verifying Linux dependencies are installed..."
        dpkg -l | grep -E "(build-essential|autoconf|libtool)" || echo "Some dependencies not found"
        echo "Dependencies check completed"

    # === TA-Lib Installation ===
    - name: Cache TA-Lib Installation
      id: cache-talib
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/lib/libta_lib.*
          ~/.local/include/ta-lib/
          ~/.local/include/ta_*.h
          ~/.local/bin/ta-lib-config
        key: ${{ runner.os }}-talib-${{ inputs.ta-lib-version }}-userlocal-v2
        restore-keys: |
          ${{ runner.os }}-talib-${{ inputs.ta-lib-version }}-userlocal-
          ${{ runner.os }}-talib-userlocal-

    - name: Install TA-Lib C Library
      if: steps.cache-talib.outputs.cache-hit != 'true'
      run: |
        wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-${{ inputs.ta-lib-version }}-src.tar.gz
        tar -xzf ta-lib-${{ inputs.ta-lib-version }}-src.tar.gz
        cd ta-lib/
        mkdir -p ~/.local
        ./configure --prefix=$HOME/.local
        make
        make install
        echo "$HOME/.local/lib" >> /etc/ld.so.conf.d/talib.conf || echo "Using LD_LIBRARY_PATH instead"

    - name: Set TA-Lib Environment Variables
      run: |
        echo "TA_LIBRARY_PATH=$HOME/.local/lib" >> $GITHUB_ENV
        echo "TA_INCLUDE_PATH=$HOME/.local/include" >> $GITHUB_ENV
        echo "LD_LIBRARY_PATH=$HOME/.local/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV

    - name: Verify TA-Lib Installation
      run: |
        ls -la ~/.local/lib/libta_lib.* 2>/dev/null || echo "TA-Lib libraries not found"
        ls -la ~/.local/include/ta_*.h 2>/dev/null || echo "TA-Lib headers not found"
        ls -la ~/.local/include/ta-lib/ 2>/dev/null || echo "TA-Lib header directory not found"
        echo "TA_LIBRARY_PATH: $TA_LIBRARY_PATH"
        echo "TA_INCLUDE_PATH: $TA_INCLUDE_PATH"

    # === Python Setup ===
    - name: Set Up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: pyproject.toml

    - name: Upgrade pip and Install TA-Lib Python Package
      run: |
        python -m pip install --upgrade pip
        # Install TA-Lib Python wrapper with our compiled library
        pip install TA-Lib

    - name: Cache Python Dependencies
      id: cache-python-deps
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ${{ env.pythonLocation }}
        key: ${{ runner.os }}-python-${{ inputs.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ inputs.python-version }}-

    - name: Install Python Dependencies
      run: |
        pip install git+https://github.com/marcelohack/connors-core.git
        pip install git+https://github.com/marcelohack/connors-datafetch.git
        pip install -e ".[dev]"

    # === Environment Validation ===
    - name: Test Environment
      run: |
        echo "Testing Python environment..."
        python --version
        python -c "import talib; print(f'TA-Lib version: {talib.__version__}')"
        python -c "import pandas; print(f'Pandas version: {pandas.__version__}')"
        python -c "import numpy; print(f'NumPy version: {numpy.__version__}')"
        echo "Environment test completed successfully"

    - name: Create Environment Artifact
      run: |
        # Create a summary of the built environment
        mkdir -p environment-info
        cat > environment-info/environment.json << EOF
        {
          "python_version": "${{ inputs.python-version }}",
          "talib_version": "${{ inputs.ta-lib-version }}",
          "build_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "runner_os": "${{ runner.os }}",
          "cache_key": "${{ steps.cache-keys.outputs.env-key }}",
          "ta_library_path": "$HOME/.local/lib",
          "ta_include_path": "$HOME/.local/include"
        }
        EOF

        # Save environment variables for the CI workflow
        cat > environment-info/environment.env << EOF
        TA_LIBRARY_PATH=$HOME/.local/lib
        TA_INCLUDE_PATH=$HOME/.local/include
        LD_LIBRARY_PATH=$HOME/.local/lib:$LD_LIBRARY_PATH
        PKG_CONFIG_PATH=$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH
        EOF

    - name: Upload Environment Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-environment-${{ steps.cache-keys.outputs.env-key }}
        path: environment-info/
        retention-days: 1

    - name: Set Environment Status
      id: env-status
      run: |
        echo "ready=true" >> $GITHUB_OUTPUT
        echo "Environment successfully built and ready for CI workflows"