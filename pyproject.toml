[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connors-strategies"
version = "0.1.0"
description = "Built-in trading strategies and services for Connors Trading"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    # Core components (registry, config, indicators, screening)
    "connors-core>=0.1.0",
    # Data fetcher (for backtest_service datasource access)
    "connors-datafetch>=0.1.0",
    # Core trading and backtesting
    "backtesting>=0.3.3",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Technical analysis
    "TA-Lib>=0.6.6",
    "pandas-ta>=0.3.14b0",
    "talipp>=2.3.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    # Date/time handling
    "pytz>=2023.3",
    # CLI interface (used by services)
    "click>=8.1.0",
    "rich>=13.0.0",
    "colorlog>=6.8.0",
    # HTTP requests
    "httpx>=0.25.0",
    # Data visualization
    "matplotlib>=3.7.0",
    "plotly>=5.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["connors_strategies*"]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
